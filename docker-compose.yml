services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  springboot:
    build: .
    container_name: springboot-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    # Secrets lus dans .env (non suivi par git ; modèle : .env.example). Le profil prod
    # refuse de démarrer si une variable obligatoire manque (SecretsRequisVerificateur).
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
    restart: always

volumes:
  mongo_data:
