

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  springboot:
    build: .
    container_name: springboot_app
    ports:
      - "8080:8080"
    depends_on:
      - mongo 
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/cleanic

volumes:
  mongo_data:
