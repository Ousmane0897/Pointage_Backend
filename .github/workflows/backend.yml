name: CI/CD Backend - Spring Boot (Gradle)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'
      # le JAR est construit (build) sans tests avec '-x test' ( plus rapide) dans 3️⃣  et les tests sont exécutés juste après pour valider ton code dans 4️⃣. Donc le JAR est construit sans tests (rapide) et les tests sont exécutés juste après pour valider ton code.
      # 3️⃣ Build with Gradle
      - name: Build backend
        run: ./gradlew clean build -x test

      # 4️⃣ Run tests
      - name: Run tests
        run: ./gradlew test

      # 5️⃣ Docker login
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6️⃣ Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: myorg/myapp-backend:latest

      # 7️⃣ Deploy on VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/myapp
            docker-compose pull backend
            docker-compose up -d backend
