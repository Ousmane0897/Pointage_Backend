plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// =========================
	// SPRING BOOT CORE
	// =========================
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// =========================
	// JWT
	// =========================
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// =========================
	// VALIDATION / JACKSON
	// =========================
	implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'

	// =========================
	// MAPSTRUCT
	// =========================
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'


	// 🔥 LIAISON Lombok <-> MapStruct (SINON ÉCHEC)
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// =========================
	// LOMBOK
	// =========================
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// =========================
	// DEVTOOLS
	// =========================
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// =========================
	// TESTS (🔥 IMPORTANT)
	// =========================
	testImplementation 'org.springframework.boot:spring-boot-starter-test' // JUnit 5 + Assert + MockMvc
	testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
	testImplementation 'org.springframework.security:spring-security-test'
}

compileJava {
	options.compilerArgs += [
			"-Amapstruct.defaultComponentModel=spring"
	]
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
	jvmArgs += [
			"-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}"
	]
}

