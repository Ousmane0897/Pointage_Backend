spring:
  data:
    mongodb:
      uri: mongodb://mongo:27017/pointage_cleanic

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}

app:
  frontend:
    # URL publique de l'application (celle que les utilisateurs ouvrent dans leur navigateur),
    # utilisée pour le lien « Ouvrir le bon » des e-mails de notification. À distinguer de
    # l'API, servie depuis une origine séparée (api.pointic-cleanic.com).
    # Valeur alignée sur les origines autorisées par le CORS de SecurityConfig ; surchargeable
    # par la variable d'environnement APP_FRONTEND_BASE_URL.
    base-url: ${APP_FRONTEND_BASE_URL:https://pointic-cleanic.com}
  conges:
    # Jours ouvrables acquis par mois de service effectif (droit sénégalais : 2 j/mois,
    # soit 24 j pour une année pleine). Remplace l'ancien forfait annuel, qui accordait
    # autant de jours à un employé embauché en novembre qu'à un employé présent toute l'année.
    jours-acquis-par-mois: ${CONGES_JOURS_ACQUIS_PAR_MOIS:2}


google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY}

server:
  # Derrière nginx/docker : l'IP cliente (limite de débit du pointage public) vient de
  # X-Forwarded-For uniquement si la requête arrive d'un mandataire interne (RemoteIpValve).
  forward-headers-strategy: native

springdoc:
  # Documentation de l'API fermée en production (lot 0 sécurité) : elle décrit toutes les
  # routes et leurs paramètres. Reste disponible en dev.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
