spring:
  # Développement : variables lues dans un fichier .env local NON suivi par git (modèle :
  # .env.example). En production, elles viennent de l'environnement (docker-compose env_file).
  config:
    import: optional:file:.env[.properties]

  data:
    mongodb:
      # Replica set à un nœud obligatoire depuis 1a (transactions) : docker-compose.dev.yml.
      # directConnection : le poste parle au seul nœud, quel que soit le nom qu'il s'annonce.
      uri: mongodb://localhost:27017/cleanic?directConnection=true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    date-format: dd/MM/yyyy
    time-zone: Africa/Dakar

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  # Aucune valeur par défaut : à fournir par l'environnement (voir .env.example).
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operationsSorter: method


google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY}

app:
  frontend:
    # URL publique du front, utilisée pour construire les liens des e-mails de notification
    # (« Ouvrir le bon » à la création d'un bon d'entrée / de sortie, « Ouvrir la demande »
    # pour les congés). Si vide, le mail part sans lien plutôt qu'avec un lien cassé.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
  conges:
    # Jours ouvrables acquis par mois de service effectif (droit sénégalais : 2 j/mois,
    # soit 24 j pour une année pleine). Remplace l'ancien forfait annuel, qui accordait
    # autant de jours à un employé embauché en novembre qu'à un employé présent toute l'année.
    jours-acquis-par-mois: ${CONGES_JOURS_ACQUIS_PAR_MOIS:2}

rh:
  import:
    bulk:
      # Taille maximale d'un import bulk de dossiers employés (POST /api/dossier-employe/bulk).
      max-size: 1000
  pointage:
    # Tolérance de retard (minutes) sur le pointage centralisé RH : un retard n'est marqué
    # (statut RETARD + comptage dans resume.retards) que si retardBrut > ce seuil. 15 pile
    # = non retard. Ajustable sans recompilation (env RH_POINTAGE_TOLERANCE_RETARD_MINUTES).
    tolerance-retard-minutes: 15

pointage:
  # Limite de débit du pointage public POST /api/pointages (PointageLimiteurDebit, fenêtre
  # glissante d'une minute). Le seuil par IP est large : beaucoup d'agents peuvent pointer
  # derrière une seule IP (NAT d'un site, proxy qui ne transmet pas X-Forwarded-For).
  limite:
    par-ip-par-minute: 60
    par-appareil-par-minute: 10
    # Codes inconnus d'affilée (par IP et par appareil) avant blocage ; un succès remet à zéro.
    codes-inconnus-avant-blocage: 5
    duree-blocage-minutes: 15


logging:
  level:
    root: ERROR
    org.springframework.web: INFO
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    # INFO : en DEBUG, Spring Security journalise le détail de chaque requête (en-têtes compris).
    org.springframework.security: INFO
    com.example: DEBUG
