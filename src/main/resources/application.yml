spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/cleanic

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    date-format: dd/MM/yyyy
    time-zone: Africa/Dakar

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: w9awKW+/x+VOzOyvg5DY3D7qWVZhipaV6VH8h9c4JS8=

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operationsSorter: method


google:
  maps:
    api:
      key: "AIzaSyAijDeBFgsJUYLqS6Nn3EQfi56cPPMtN_Q"

app:
  frontend:
    # URL publique du front, utilisée pour le lien « Ouvrir le bon » des e-mails de
    # notification (création d'un bon d'entrée / de sortie). Si vide, le mail part sans
    # lien plutôt qu'avec un lien cassé.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}

rh:
  import:
    bulk:
      # Taille maximale d'un import bulk de dossiers employés (POST /api/dossier-employe/bulk).
      max-size: 1000


logging:
  level:
    root: ERROR
    org.springframework.web: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.security: DEBUG
    com.example: DEBUG
