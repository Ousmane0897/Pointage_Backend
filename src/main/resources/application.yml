spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/cleanic

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    date-format: dd/MM/yyyy
    time-zone: Africa/Dakar

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: w9awKW+/x+VOzOyvg5DY3D7qWVZhipaV6VH8h9c4JS8=

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operationsSorter: method


google:
  maps:
    api:
      key: "AIzaSyAijDeBFgsJUYLqS6Nn3EQfi56cPPMtN_Q"

rh:
  import:
    bulk:
      # Taille maximale d'un import bulk de dossiers employés (POST /api/dossier-employe/bulk).
      max-size: 1000
  pointage:
    # Tolérance de retard (minutes) sur le pointage centralisé RH : un retard n'est marqué
    # (statut RETARD + comptage dans resume.retards) que si retardBrut > ce seuil. 15 pile
    # = non retard. Ajustable sans recompilation (env RH_POINTAGE_TOLERANCE_RETARD_MINUTES).
    tolerance-retard-minutes: 15


logging:
  level:
    root: ERROR
    org.springframework.web: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.security: DEBUG
    com.example: DEBUG
